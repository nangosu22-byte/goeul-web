</head>
<body>
<canvas id="scene" tabindex="0" aria-label="조선 고을 3D 화면"></canvas>
<div class="letterbox" id="lbTop"></div><div class="letterbox" id="lbBot"></div>
<div id="cineCaption" hidden></div>

<header class="hud">
  <div class="card clock">
    <div class="date" id="hDate">경자년 봄 1일</div>
    <div class="sub"><span id="hTime">묘시</span><span class="badge" id="hWeather">맑음</span><span class="badge" id="hMarket">장날까지 1일</span><span class="badge" id="hRank">상민</span></div>
    <div class="daybar"><i id="hBar"></i></div>
  </div>
  <div class="mid">
    <div class="card speed" role="group" aria-label="시간 속도">
      <button data-speed="0">정지</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button><button data-skip="season" title="다음 철이 올 때까지 빠르게">철 넘기기</button><button data-skip="year" title="다음 해 봄이 올 때까지 빠르게">해 넘기기</button>
    </div>
    <button class="card iconbtn" id="mapBtn" aria-label="지역 지도 (M)" title="지역 지도 (M)">圖</button>
    <button class="card iconbtn" id="menuBtn" aria-label="메뉴 열기">≡</button>
  </div>
  <div class="card purse">
    <div class="lbl">현금</div>
    <div class="cash" id="hCash">50냥</div>
    <div class="worth" id="hWorth">가문 재산</div>
    <div class="karmini"><span>악</span><span class="axis"><i id="hKarma" style="left:50%"></i></span><span>선</span><span id="hRep">평판 50</span></div>
  </div>
</header>
<div class="card" id="followBadge" hidden><span><b id="followName"></b> 따라가는 중</span><button class="btn mini" id="followStop">그만</button></div>
<div class="card hint">드래그 회전 · 우클릭 드래그 이동 · 휠 확대 · 우리 사람을 눌러 고르고 땅이나 사람을 누르기 · Esc 메뉴</div>
<div class="card" id="tutorial" hidden></div>

<aside class="card" id="panel">
  <nav class="tabs" id="tabs">
    <button class="fold" id="fold" aria-label="메뉴 접기" title="메뉴 접기·펼치기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.2" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="15.8" width="18" height="4" rx="2"/></g></svg></button>
    <button data-tab="home" class="on">가문</button><button data-tab="rep">평판</button><button data-tab="people">인맥</button><button data-tab="rank">출세</button>
    <button data-tab="fields">논밭</button><button data-tab="smithy">대장간</button><button data-tab="shops">가게</button><button data-tab="market">장터</button><button data-tab="rival">최씨</button><button data-tab="law">송사</button><button data-tab="mil">군사</button><button data-tab="gwana">관아</button>
  </nav>
  <div class="pbody" id="pbody"></div>
</aside>

<div class="card" id="log"></div>
<div class="card float" id="tag" hidden></div>
<div class="bubble" id="bub0" hidden></div><div class="bubble" id="bub1" hidden></div><div class="bubble" id="bub2" hidden></div><div class="bubble" id="bub3" hidden></div>
<div class="card" id="toast" hidden></div>
<div class="card" id="actorCard" hidden></div>
<div class="card" id="ipop" hidden role="dialog" aria-label="상호작용"></div>
<div class="card" id="sres" hidden aria-live="polite"></div>
<div class="card" id="duel" hidden aria-live="polite">
  <div class="dt">맞대결 · 기세</div>
  <div class="sides">
    <div class="side"><b id="dLname"></b><small id="dLsub"></small><div class="meter"><i id="mK"></i></div></div>
    <div class="vs">대</div>
    <div class="side r"><b id="dRname"></b><small id="dRsub"></small><div class="meter"><i id="mV"></i></div></div>
  </div>
  <div class="ev" id="dEv"></div>
  <div class="chips" id="dChips"></div>
</div>
<div id="cut" hidden>
  <div class="lb top"></div><div class="lb bot"></div>
  <div class="band"></div>
  <svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <g id="splat"></g>
    <path class="slash" id="slash1" d="M120 700 C 520 520, 900 330, 1500 110" stroke-width="30"/>
    <path class="slash" id="slash2" d="M200 690 C 560 520, 940 360, 1460 150" stroke-width="10" opacity=".7"/>
  </svg>
  <div class="who a"><small id="cutAsub"></small><span id="cutA"></span></div>
  <div class="who v"><small id="cutVsub"></small><span class="x" id="cutV"></span></div>
  <div class="seal"><span id="cutSeal">殺</span></div>
  <div class="cap" id="cutCap"></div>
  <div class="flash"></div>
</div>

<section id="title" hidden>
  <div class="tbox">
    <div class="eyebrow">朝鮮 家門 經營</div>
    <h1 class="ttl">고을 상단기</h1>
    <p class="tsub">오일장 장터에서 일어선 한 집안이 품계를 사고, 관원과 백성의 마음을 얻어 고을의 사또가 되기까지.</p>
    <div id="titleMenu"></div>
  </div>
</section>
<div id="rmap" hidden></div>
<div id="modal" hidden></div>
<div id="loading"><div><div class="ttl" style="font-family:var(--f-title)">고을 상단기</div><div class="lbar"><i id="loadBar"></i></div><div id="loadMsg">불러오는 중</div></div></div>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
